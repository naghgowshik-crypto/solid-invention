# Render Blueprint Specification for Sreyas Media Club Platform
# https://render.com/docs/blueprint-spec

services:
  # 1. Spring Boot Backend Web Service (Free Docker Web Service)
  - type: web
    name: sreyas-media-club-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    rootDir: backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: sreyas-media-club-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: sreyas-media-club-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: sreyas-media-club-db
          property: password
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sreyas-media-club-frontend
          property: host
      - key: STORAGE_PROVIDER
        value: local

  # 2. React Frontend Static Site (Free Static Site)
  - type: web
    name: sreyas-media-club-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sreyas-media-club-backend
          property: host
          path: /api

databases:
  # 3. Render Managed PostgreSQL Database (Free Database Instance)
  - name: sreyas-media-club-db
    databaseName: sreyas_media_club
    user: sreyas_admin
    plan: free
