# Server Configuration (Render dynamic PORT compatibility)
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/


# Database Configuration (PostgreSQL with fallback URL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sreyas_media_club}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

# Hikari Connection Pool Settings (Scalability)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

# H2 Console (for quick inspecting during dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Frontend CORS Origin Config
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Swagger UI / OpenAPI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Spring Boot Actuator Health Monitoring (Exposes safe status only, no credentials/details)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

